version: '3.8'

services:
  # O Cérebro: Banco de Dados Analítico
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: cnpj_db
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=senha123
    ports:
      - "8123:8123" # Porta HTTP para conectar ferramentas de BI
      - "9000:9000" # Porta nativa TCP
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse

